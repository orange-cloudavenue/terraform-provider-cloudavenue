name: PR All events

on:
  pull_request:
    types: [ opened, reopened, synchronize, edited ]
  # Trusted triggers required by the tests job below.
  push:
    branches: [ main ]
  workflow_dispatch:


concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-pr-all
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog-dependabot:
    if: github.event_name == 'pull_request'
    name: "Changelog Dependabot"
    uses: orange-cloudavenue/workflows/.github/workflows/changelog_dependabot.yml@main
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-size:
    if: github.event.action != 'edited' && github.event_name == 'pull_request'
    name: "PR Size"
    uses: orange-cloudavenue/workflows/.github/workflows/pr_label_size.yml@main
    with:
      ref: ${{ github.ref }}
      repository: ${{ github.repository }}

  pr-conventional-commits:
    if: github.event_name == 'pull_request'
    name: "Conventional Commits"
    uses: orange-cloudavenue/workflows/.github/workflows/pr_conventional_commits.yml@main

  pr-license:
    if: github.event.action != 'edited' && github.event.pull_request.draft == false && github.event_name == 'pull_request'
    name: "License Check"
    uses: orange-cloudavenue/workflows/.github/workflows/pr_license.yml@main
    with:
      ref: ${{ github.ref }}
      repository: ${{ github.repository }}

  changelog-validation:
    if: github.event.action != 'edited' && github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'skip-changelog') && github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'repo-sync/')
    name: "Changelog Validation"
    uses: orange-cloudavenue/workflows/.github/workflows/changelog_validation.yml@main
    with:
      ref: ${{ github.ref }}
      repository: ${{ github.repository }}
    secrets:
      TOKEN: ${{ secrets.PR_CI_PAT }}
  go-license-check:
    if: github.event.action != 'edited' && github.event.pull_request.draft == false && github.event_name == 'pull_request'
    name: "Go Dependency License Check"
    uses: orange-cloudavenue/workflows/.github/workflows/go_license-check.yml@main
    with:
      ref: ${{ github.ref }}
      repository: ${{ github.repository }}

  golang-ci-lint:
    if: github.event.action != 'edited' && github.event.pull_request.draft == false && github.event_name == 'pull_request'
    name: "Lint"
    uses: orange-cloudavenue/workflows/.github/workflows/go_golangci-lint.yml@main
    with:
      ref: ${{ github.ref }}
      repository: ${{ github.repository }}

  tests:
    # Privileged integration tests: trusted-trigger runs only.
    if: github.event_name != 'pull_request'
    name: "Unit Tests"
    uses: orange-cloudavenue/workflows/.github/workflows/go_unit-test-tf-provider.yml@main
    with:
        ref: ${{ github.ref }}
        repository: ${{ github.repository }}
    secrets:
        CLOUDAVENUE_ORG: ${{ secrets.CLOUDAVENUE_ORG }}
        CLOUDAVENUE_USER: ${{ secrets.CLOUDAVENUE_USER }}
        CLOUDAVENUE_PASSWORD: ${{ secrets.CLOUDAVENUE_PASSWORD }}
        CLOUDAVENUE_VDC: ${{ secrets.CLOUDAVENUE_VDC }}
