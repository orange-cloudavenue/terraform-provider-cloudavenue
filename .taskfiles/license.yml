# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes: 
  internal: internal.yml

tasks:
  # * Linters
  lint:
    desc: Run license linters
    cmds:
      - for: [
          license-header,
          license-header-dedupe,
          license-years,
        ]
        task: lint:{{.ITEM}}

  lint:license-header:
    desc: Run license header
    internal: true
    preconditions:
      - sh: command -v license-eye
        msg: "license-eye is not installed. Please run `task license:install`"
      - sh: test -f .licenserc.yaml
        msg: "No .licenserc.yaml file found.`"
    cmds:
      - license-eye header check

  lint:license-years:
    desc: Check license years
    internal: true
    cmds:
      - python3 scripts/fix_license_years.py . --recursive --check

  lint:license-header-dedupe:
    desc: Check duplicate license headers
    internal: true
    cmds:
      - python3 scripts/dedupe_license_headers.py . --recursive --check

  # * Init
  init:
    desc: Initialize the license
    silent: true
    cmds:
      - defer: echo "✅ License are initialized"

  # * Install
  install:
    desc: Install required tools
    cmds:
      - for: [
          license-eye,
        ]
        task: internal:tools:brew
        vars:
          APP: '{{.ITEM}}'

  # * Actions 
  run: 
    desc: Run license actions
    cmds:
      - for: [
          license-header-fix,
          license-years-fix,
          license-header-dedupe-fix,
        ]
        task: actions:{{.ITEM}}

  # ? Generate
  actions:license-header-fix:
    desc: Run license header
    internal: true
    preconditions:
      - sh: command -v license-eye
        msg: "license-eye is not installed. Please run `task license:install`"
      - sh: test -f .licenserc.yaml
        msg: "No .licenserc.yaml file found.`"
    cmds:
      - license-eye header fix

  actions:license-years-fix:
    desc: Rewrite license years from git history
    internal: true
    cmds:
      - python3 scripts/fix_license_years.py . --recursive

  actions:license-header-dedupe-fix:
    desc: Remove duplicate license headers
    internal: true
    cmds:
      - python3 scripts/dedupe_license_headers.py . --recursive
